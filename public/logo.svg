     FIXES vs the previous version:
     1. viewBox widened 220 -> 252. The wordmark's advance width in Fraunces SemiBold
        @30px is 182.5px starting at x=64, so it ended at x=246.5 and was clipped by
        26.5px inside a 220-wide viewBox.
     2. Arch apex moved from y=0 to y=2 so its 3px stroke is no longer half-clipped
        by the top edge; baseline of the box moved 52 -> 54, height 56 -> 60.
     3. The wordmark is now OUTLINED (no <text> element). An SVG loaded through
        <img>/next/image is an isolated document and cannot use the page's webfonts,
        so the old font-family="Fraunces, Georgia, serif" silently fell back to
        Georgia (or generic serif on Android/Linux), changing metrics per device.
        Outlines render identically everywhere.
     Colour is baked to #12302A (neem-900) on purpose: currentColor does NOT inherit
     through <img>. If you need colour control, render the mark as an inline React
     component instead and switch both fills to currentColor. -->
