name: Scheduled jobs

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 3 * * *"
    - cron: "30 3 * * *"
    - cron: "0 */6 * * *"
  workflow_dispatch: {}


# Vercel Hobby cron is limited to once a day, which is not enough for hold
# release; GitHub Actions gives 2,000 free minutes/month and is the fit here.
concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  release-holds:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Release expired holds
        run: |
          [[ "$SITE_URL" == https://* ]] && test -n "$CRON_SECRET"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/release-holds"

  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * *'
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Send 24h reminders
        run: |
          [[ "$SITE_URL" == https://* ]] && test -n "$CRON_SECRET"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/send-reminders"

  admin-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *'
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Send admin digest
        run: |
          [[ "$SITE_URL" == https://* ]] && test -n "$CRON_SECRET"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/admin-digest"

  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Keep Supabase awake
        run: |
          [[ "$SITE_URL" == https://* ]] && test -n "$CRON_SECRET"
          SITE_URL="${SITE_URL%/}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/keep-alive"
