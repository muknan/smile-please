name: Weekly database backup

on:
  schedule:
    - cron: "0 4 * * 1"     # Mondays 04:00 UTC (09:30 IST)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Dump + encrypt the database
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" && test -n "$BACKUP_PASSPHRASE"
          trap 'rm -f backup.dump' EXIT
          server_version="$(psql "$SUPABASE_DB_URL" -Atc 'show server_version_num')"
          client_version="$(pg_dump --version | sed -E 's/.* ([0-9]+)(\..*)?$/\1/')"
          server_major="${server_version:0:2}"
          if [ "$client_version" -lt "$server_major" ]; then
            echo "pg_dump $client_version cannot dump PostgreSQL $server_major" >&2
            exit 1
          fi
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl -F c -f backup.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase-file <(printf '%s' "$BACKUP_PASSPHRASE") \
            --symmetric --cipher-algo AES256 --s2k-count 65011712 --output backup.dump.gpg backup.dump

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.dump.gpg
          retention-days: 90

      - name: Remove encrypted backup from runner
        if: always()
        run: rm -f backup.dump backup.dump.gpg
