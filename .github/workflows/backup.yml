name: Weekly database backup

on:
  schedule:
    - cron: "0 4 * * 1"     # Mondays 04:00 UTC (09:30 IST)
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump + encrypt the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-acl -F c -f backup.dump
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" -c backup.dump

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup.dump.gpg
          retention-days: 90
